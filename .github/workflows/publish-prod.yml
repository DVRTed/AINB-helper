name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production files
        run: npm run build:usync

      - name: Publish files to production branch
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          artifact_dir="$(mktemp -d)"
          if [ -n "$VERSION" ]; then
            commit_message="v$VERSION (see [[User:DVRTed/AINB-helper/Changelog#v$VERSION]])"
          else
            commit_message="unknown version"
          fi
          cp dist/AINB-helper.js dist/changelog.js "$artifact_dir/"

          if git ls-remote --exit-code --heads origin refs/heads/production >/dev/null 2>&1; then
            git fetch origin production
            git checkout -B production FETCH_HEAD
          else
            git checkout --orphan production
            git rm -rf .
          fi

          cp "$artifact_dir/AINB-helper.js" "$artifact_dir/changelog.js" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- AINB-helper.js changelog.js

          if git diff --cached --quiet; then
            echo "Production files are unchanged."
          else
            git commit -m "$commit_message"
            git push origin HEAD:production
          fi